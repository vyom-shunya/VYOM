<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061522">
<title>VYOM • आपका स्वागत</title>
<style>
:root{
  --bg:#061522; --bg2:#081d2d; --cyan:#5de7f2; --text:#f4fbff;
  --muted:#9db4c1; --line:rgba(93,231,242,.18);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{
  min-height:100vh; min-height:100dvh; overflow:hidden;
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;
  background:
    radial-gradient(circle at 50% 15%,rgba(55,202,220,.13),transparent 30%),
    linear-gradient(145deg,var(--bg),var(--bg2) 55%,#04111c);
}
body:before{
  content:""; position:fixed; inset:-25%; pointer-events:none;
  background:radial-gradient(circle,rgba(93,231,242,.08) 0 1px,transparent 1.5px);
  background-size:42px 42px; opacity:.25; transform:rotate(10deg);
}
.screen{
  min-height:100vh; min-height:100dvh; display:flex;
  align-items:center; justify-content:center; padding:18px; position:relative;
}
.card{
  width:min(420px,100%); padding:38px 28px 28px; text-align:center;
  border:1px solid var(--line); border-radius:28px;
  background:linear-gradient(180deg,rgba(9,34,50,.80),rgba(5,21,32,.74));
  box-shadow:0 24px 70px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
.logo{
  width:118px; height:118px; margin:0 auto 22px; border-radius:50%;
  display:block; object-fit:cover;
  box-shadow:0 0 0 8px rgba(93,231,242,.035),0 0 38px rgba(93,231,242,.14);
}
.brand{
  margin:0; color:#f4fbff; font-size:38px; line-height:1;
  letter-spacing:.24em; padding-left:.24em; font-weight:700;
}
.welcome{margin:16px 0 32px;color:#d9edf2;font-size:20px;font-weight:400}
.google{
  width:100%; min-height:56px; border:1px solid rgba(255,255,255,.18);
  border-radius:16px; background:#fff; color:#172027;
  display:flex; align-items:center; justify-content:center; gap:13px;
  padding:0 20px; font:600 16px system-ui,sans-serif; cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}
.google:active{transform:translateY(1px)}
.gicon{width:22px;height:22px}
.footer{margin-top:30px;color:var(--muted);font-size:12px;letter-spacing:.08em}
.footer span{color:var(--cyan)}
@media(max-width:430px){
  .card{padding:32px 20px 25px;border-radius:24px}
  .logo{width:104px;height:104px;margin-bottom:20px}
  .brand{font-size:34px}
  .welcome{font-size:18px;margin-bottom:29px}
}
</style>
</head>

<script>
const SUPABASE_URL = "https://cpiuytuswbpvmblynpdh.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_S_Qxhf9lPN2kzc-LyUKW1Q_yIRfpTzY";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage, storageKey: "vyom-auth" }
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    window.location.replace('./home.html');
  }
})();

document.getElementById('googleLogin').addEventListener('click', async function(){
  this.disabled = true;
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: 'https://vyom-shunya.github.io/VYOM/home.html',
    }
  });
  if (error) {
    this.disabled = false;
    alert('Google Login में समस्या आई। कृपया फिर से प्रयास करें।');
  }
});

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (session) {
    const user = session.user;
    const name = user?.user_metadata?.full_name || user?.user_metadata?.name || user?.email || '';
    const avatar = user?.user_metadata?.avatar_url || user?.user_metadata?.picture || '';
    if (name) localStorage.setItem('vyom-name', name);
    if (avatar) localStorage.setItem('vyom-avatar', avatar);
  }
});
</script>
