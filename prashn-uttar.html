<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>प्रश्न-उत्तर | VYOM</title>
<meta name="description" content="VYOM">
<style>
:root{
  --bg:#06121d;--surface:#0b1c2a;--surface2:#102536;--text:#eef7ff;
  --muted:#a9bccb;--line:rgba(91,220,244,.24);--accent:#63e8ff;--accent2:#25bfd9;
  --shadow:0 18px 60px rgba(0,0,0,.32);--radius:24px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% 0%,#0b2536 0,#06121d 45%,#040b12 100%);
color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;min-height:100vh}
body.theme-dark{--bg:#000;--surface:#080808;--surface2:#111;--text:#fff;--muted:#bbb;--line:#2b2b2b;--accent:#fff;--accent2:#ddd;background:#000}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
.topbar{position:sticky;top:0;z-index:50;background:rgba(5,18,29,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-weight:900;letter-spacing:.28em;font-size:20px}
.profile-wrap{position:relative}
.profile-button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent);cursor:pointer;overflow:hidden}
.profile-button img{width:100%;height:100%;object-fit:cover}
.profile-menu{position:absolute;right:0;top:62px;width:230px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--shadow);display:none}
.profile-menu.open{display:block}
.menu-item{width:100%;padding:14px 15px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:15px;cursor:pointer}
.menu-item:hover{background:var(--surface2)}
.page{max-width:1100px;margin:auto;padding:26px 18px 70px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 auto 28px;max-width:850px}
.nav a{padding:12px 8px;text-align:center;border:1px solid var(--line);border-radius:15px;color:var(--muted);background:rgba(10,29,43,.45)}
.nav a.active,.nav a:hover{color:var(--text);border-color:rgba(99,232,255,.5);background:var(--surface2)}
.hero{min-height:62vh;display:grid;place-items:center;text-align:center;padding:40px 10px}
.eye{width:min(420px,82vw);aspect-ratio:1;border-radius:50%;margin:0 auto 35px;display:grid;place-items:center;
background:radial-gradient(circle,#02070b 0 23%,#0b2230 24% 34%,#31b7c8 35% 43%,#123c50 44% 61%,#07141e 62%);box-shadow:0 0 80px rgba(44,213,238,.16),inset 0 0 45px #000}
.hero .kicker,.kicker{color:var(--accent);font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.hero h1{font-size:clamp(48px,12vw,92px);letter-spacing:.18em;margin:10px 0 18px}
.lead{font-size:clamp(18px,3vw,23px);line-height:1.8;color:var(--muted);max-width:760px;margin:0 auto}
.section{margin:35px 0}
.section-head{text-align:center;margin-bottom:22px}
.section h2{font-size:clamp(28px,5vw,42px);margin:8px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card,.panel{background:linear-gradient(145deg,rgba(16,37,54,.95),rgba(8,25,37,.95));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:25px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.card h3{margin:0 0 8px;font-size:22px}
.card p{margin:0;color:var(--muted);line-height:1.7}
.icon{font-size:30px;color:var(--accent);margin-bottom:15px}
.panel{padding:24px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border:1px solid var(--line);border-radius:14px;background:var(--accent);color:#001017;font-weight:800;cursor:pointer}
.btn.alt{background:transparent;color:var(--text)}
.btn:disabled{opacity:.6;cursor:not-allowed}
textarea,input{width:100%;background:#071722;color:var(--text);border:1px solid var(--line);border-radius:15px;padding:14px;outline:none}
textarea{min-height:150px;resize:vertical}
label{display:block;margin-bottom:8px;font-weight:700}
.note{color:var(--muted);line-height:1.7}
.qa-list{display:grid;gap:14px}
.qa{padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.qa .q{font-weight:800;font-size:18px}
.qa .a{margin-top:12px;color:var(--muted);line-height:1.8}
footer{text-align:center;padding:30px 18px;color:var(--muted);border-top:1px solid var(--line)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:none}
.modal-backdrop.open{display:block}
.modal{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:30px;text-align:center;display:none;box-shadow:var(--shadow)}
.modal.open{display:block}
.close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:var(--text);font-size:32px;cursor:pointer}
.avatar-lg{width:110px;height:110px;border-radius:50%;margin:12px auto 18px;border:2px solid var(--accent2);overflow:hidden;display:grid;place-items:center;background:#0d0d0d;font-size:44px;font-weight:800}
.avatar-lg img{width:100%;height:100%;object-fit:cover}
.modal h2{margin:8px 0;font-size:30px}
.status{margin-top:12px;color:var(--muted);min-height:24px}
.login-page{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(460px,100%);padding:36px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow)}
.google{width:100%;margin-top:22px;background:#fff;color:#111;border-color:#ddd}
.hidden{display:none!important}
@media(max-width:760px){.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.page{padding-inline:14px}.hero{min-height:55vh}.topbar-inner{padding-inline:14px}}
</style>
</head><body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./home.html">VYOM</a>
    <div class="profile-wrap">
      <button class="profile-button" type="button" onclick="toggleMenu()" aria-label="प्रोफ़ाइल">
        <span id="profileIcon">◉</span><img id="profileAvatar" alt="प्रोफ़ाइल" hidden>
      </button>
      <div class="profile-menu" id="profileMenu">
        <button class="menu-item" type="button" onclick="openProfile()">प्रोफ़ाइल</button>
        <button class="menu-item" type="button" onclick="setTheme('dark')">थीम: डार्क</button>
        <button class="menu-item" type="button" onclick="setTheme('vyom')">थीम: VYOM</button>
        <a class="menu-item" href="./home.html">VYOM के बारे में</a>
        <button class="menu-item" type="button" onclick="logoutVYOM()">लॉग आउट</button>
      </div>
    </div>
  </div>
</header>

<main class="page">
    <nav class="nav" aria-label="मुख्य नेविगेशन">
      <a class="" href="./home.html">होम</a>
      <a class="active" href="./prashn-uttar.html">प्रश्न-उत्तर</a>
      <a class="" href="./sahbhagita.html">सहभागिता</a>
      <a href="https://youtube.com/@vyom-000?si=ciXO8zUHqLblK2nj" target="_blank" rel="noopener">YouTube</a>
    </nav>
    
<section class="section">
  <div class="section-head"><div class="kicker">VYOM</div><h2>प्रश्न-उत्तर</h2><p class="lead">आध्यात्मिक विषय से जुड़ा अपना प्रश्न लिखें।</p></div>
  <div class="panel">
    <label for="question">आपका प्रश्न</label>
    <textarea id="question" maxlength="2000" placeholder="अपना प्रश्न यहाँ लिखें..."></textarea>
    <div class="actions"><button class="btn" id="sendQuestion" type="button">प्रश्न भेजें</button></div>
    <p class="status" id="questionStatus"></p>
  </div>
</section>
<section class="section">
  <div class="section-head"><div class="kicker">VYOM</div><h2>उत्तर</h2></div>
  <div class="qa-list" id="qaList"><div class="qa"><p class="note">प्रश्न लोड हो रहे हैं...</p></div></div>
</section>
</main>

<div class="modal-backdrop" id="profileBackdrop" onclick="closeProfile()"></div>
<section class="modal" id="profileModal" aria-hidden="true">
  <button class="close" type="button" onclick="closeProfile()" aria-label="बंद करें">×</button>
  <div class="avatar-lg" id="profileModalAvatar">V</div>
  <h2 id="profileModalTitle">VYOM सदस्य</h2>
  <p class="note">VYOM सदस्य प्रोफ़ाइल</p>
</section>

<footer>VYOM</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://cpiuytuswbpvmblynpdh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_S_Qxhf9lPN2kzc-LyUKW1Q_yIRfpTzY';
const supabase = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}
});

function initials(name){return (name||'V').trim().slice(0,1)||'V';}

function userInfo(user){
  const m=user?.user_metadata||{};
  return {
    name:m.full_name||m.name||user?.email?.split('@')[0]||'VYOM सदस्य',
    avatar:m.avatar_url||m.picture||''
  };
}

function renderProfile(user){
  if(!user)return;
  const {name,avatar}=userInfo(user);
  const top=document.getElementById('profileAvatar');
  const icon=document.getElementById('profileIcon');
  const modal=document.getElementById('profileModalAvatar');
  const title=document.getElementById('profileModalTitle');
  if(title)title.textContent=name;
  if(avatar){
    if(top){top.src=avatar;top.hidden=false;}
    if(icon)icon.hidden=true;
    if(modal)modal.innerHTML='<img src="'+avatar.replace(/"/g,'&quot;')+'" alt="प्रोफ़ाइल">';
  }else{
    if(top)top.hidden=true;
    if(icon)icon.hidden=false;
    if(modal)modal.textContent=initials(name);
  }
}

async function ensureProfile(user){
  const {name,avatar}=userInfo(user);
  const {error}=await supabase.from('vyom_profiles').upsert(
    {user_id:user.id,display_name:name,avatar_url:avatar},
    {onConflict:'user_id'}
  );
  if(error)console.error('Profile save:',error);
}

async function requireSession(){
  const {data}=await supabase.auth.getSession();
  if(data?.session){renderProfile(data.session.user);ensureProfile(data.session.user);return data.session;}
  window.location.replace('./index.html');
  return null;
}

async function googleLogin(){
  const btn=document.getElementById('googleLogin');
  if(btn)btn.disabled=true;
  const {error}=await supabase.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:location.origin+location.pathname.replace(/index\.html$/,'home.html')}
  });
  if(error){
    if(btn)btn.disabled=false;
    alert('Google Login में समस्या आई: '+error.message);
  }
}

async function logoutVYOM(){
  const {error}=await supabase.auth.signOut();
  localStorage.removeItem('vyom-theme');
  if(error){alert('Logout में समस्या आई: '+error.message);return;}
  window.location.replace('./index.html');
}

function toggleMenu(){
  document.getElementById('profileMenu')?.classList.toggle('open');
}
function setTheme(theme){
  document.body.classList.toggle('theme-dark',theme==='dark');
  localStorage.setItem('vyom-theme',theme);
  document.getElementById('profileMenu')?.classList.remove('open');
}
function openProfile(){
  document.getElementById('profileMenu')?.classList.remove('open');
  document.getElementById('profileBackdrop')?.classList.add('open');
  document.getElementById('profileModal')?.classList.add('open');
}
function closeProfile(){
  document.getElementById('profileBackdrop')?.classList.remove('open');
  document.getElementById('profileModal')?.classList.remove('open');
}
(function(){
  if(localStorage.getItem('vyom-theme')==='dark')document.body.classList.add('theme-dark');
  document.addEventListener('click',e=>{
    const w=document.querySelector('.profile-wrap'),m=document.getElementById('profileMenu');
    if(w&&m&&!w.contains(e.target))m.classList.remove('open');
  });
  supabase.auth.onAuthStateChange((event,session)=>{
    if(session?.user){renderProfile(session.user);}
  });
})();


let currentSession=null;
async function loadQuestions(){
  const list=document.getElementById('qaList');
  const {data,error}=await supabase.from('vyom_questions')
    .select('question,answer,display_name,created_at')
    .eq('status','published').not('answer','is',null)
    .order('created_at',{ascending:false});
  if(error){list.innerHTML='<div class="qa"><p class="note">प्रश्न अभी लोड नहीं हो सके।</p></div>';console.error(error);return;}
  if(!data?.length){list.innerHTML='<div class="qa"><p class="note">अभी कोई प्रश्न उपलब्ध नहीं है।</p></div>';return;}
  list.innerHTML=data.map(x=>`<article class="qa"><div class="q">प्रश्न: ${escapeHtml(x.question)}</div><div class="a"><strong>उत्तर:</strong> ${escapeHtml(x.answer)}</div><div class="note" style="margin-top:10px">पूछने वाले: ${escapeHtml(x.display_name||'VYOM सदस्य')}</div></article>`).join('');
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('sendQuestion').addEventListener('click',async()=>{
  const status=document.getElementById('questionStatus'), text=document.getElementById('question').value.trim();
  if(!text){status.textContent='कृपया प्रश्न लिखें।';return;}
  if(!currentSession){status.textContent='पहले Google से जुड़ें।';return;}
  const {name}=userInfo(currentSession.user);
  const {error}=await supabase.from('vyom_questions').insert({user_id:currentSession.user.id,display_name:name,question:text});
  if(error){status.textContent='प्रश्न भेजा नहीं जा सका।';console.error(error);return;}
  document.getElementById('question').value='';
  status.textContent='प्रश्न भेज दिया गया है।';
});
(async()=>{
  currentSession=await requireSession();
  if(currentSession)await loadQuestions();
})();

</script>
</body></html>
